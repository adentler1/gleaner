[project]
name = "gleaner"
version = "0.1.0"
description = "Single-user information monitor: watches sources, scores items, alerts on Telegram."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "requests>=2.31",
  "feedparser>=6",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "detect-secrets>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gleaner*"]
