# Example configuration. Copy watches/sources like this into the private
# config directory (outside this repository) to configure a real instance —
# never commit real watches, sources, or terms_checked notes here.

watches:
  - id: example-watch
    pattern: stream
    description: >
      Plain-language description of what counts as relevant. The scorer
      (milestone 1b) will judge every item against this text.
    sources: [example-statistics-feed]
    hard_filters:
      deadline_after: today
    alert_threshold: 70
    calendar: private

sources:
  - id: example-statistics-feed
    adapter: rss
    url: https://example.org/statistics/releases.xml
    schedule: daily
    required_fields: [title, url]
    health:
      stale_after_days: 30
      alert_on_zero_results: true
    fixture: tests/fixtures/rss/example-statistics-feed.xml
    terms_checked: 2026-10-27
